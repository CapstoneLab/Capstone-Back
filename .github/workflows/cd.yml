name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Ubuntu

    # CI가 성공했을 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy Docker container
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          UBUNTU_SSH_HOST: ${{ secrets.UBUNTU_SSH_HOST }}
          UBUNTU_SSH_PORT: ${{ secrets.UBUNTU_SSH_PORT }}
          UBUNTU_SSH_USER: ${{ secrets.UBUNTU_SSH_USER }}
          UBUNTU_SSH_PASSWORD: ${{ secrets.UBUNTU_SSH_PASSWORD }}
          UBUNTU_RUNNER_PATH: ${{ secrets.UBUNTU_RUNNER_PATH }}
          UBUNTU_WORKING_DIR: ${{ secrets.UBUNTU_WORKING_DIR }}
          UBUNTU_PYTHON_COMMAND: ${{ secrets.UBUNTU_PYTHON_COMMAND }}

          ENGINE_SHARED_TOKEN: ${{ secrets.ENGINE_SHARED_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

          CALLBACK_BASE_URL: http://${{ secrets.SERVER_HOST }}:8000

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,OAUTH_CLIENT_ID,OAUTH_CLIENT_SECRET,JWT_SECRET,DATABASE_URL,UBUNTU_SSH_HOST,UBUNTU_SSH_PORT,UBUNTU_SSH_USER,UBUNTU_SSH_PASSWORD,UBUNTU_RUNNER_PATH,UBUNTU_WORKING_DIR,UBUNTU_PYTHON_COMMAND,ENGINE_SHARED_TOKEN,ALLOWED_ORIGINS,CALLBACK_BASE_URL

          script: |
            set -e

            IMAGE="${DOCKERHUB_USERNAME}/capstone-back:${IMAGE_TAG}"
            CONTAINER="capstone-back"

            echo "Deploying ${IMAGE}"

            echo "${DOCKERHUB_TOKEN}" | docker login \
              -u "${DOCKERHUB_USERNAME}" \
              --password-stdin

            docker pull "${IMAGE}"

            docker rm -f "${CONTAINER}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER}" \
              --restart unless-stopped \
              -p 8000:8000 \
              -e GITHUB_CLIENT_ID="${OAUTH_CLIENT_ID}" \
              -e GITHUB_CLIENT_SECRET="${OAUTH_CLIENT_SECRET}" \
              -e GITHUB_REDIRECT_URI="${CALLBACK_BASE_URL}/auth/github/callback" \
              -e FRONTEND_REDIRECT_URL="${CALLBACK_BASE_URL}/auth/success" \
              -e JWT_SECRET="${JWT_SECRET}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e UBUNTU_SSH_HOST="${UBUNTU_SSH_HOST}" \
              -e UBUNTU_SSH_PORT="${UBUNTU_SSH_PORT}" \
              -e UBUNTU_SSH_USER="${UBUNTU_SSH_USER}" \
              -e UBUNTU_SSH_PASSWORD="${UBUNTU_SSH_PASSWORD}" \
              -e UBUNTU_RUNNER_PATH="${UBUNTU_RUNNER_PATH}" \
              -e UBUNTU_WORKING_DIR="${UBUNTU_WORKING_DIR}" \
              -e UBUNTU_PYTHON_COMMAND="${UBUNTU_PYTHON_COMMAND}" \
              -e WINDOWS_CALLBACK_BASE_URL="${CALLBACK_BASE_URL}" \
              -e ENGINE_SHARED_TOKEN="${ENGINE_SHARED_TOKEN}" \
              -e ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
              "${IMAGE}"

            echo "Waiting for application..."

            for i in $(seq 1 10); do
              if docker exec "${CONTAINER}" \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" \
                >/dev/null 2>&1; then

                echo "Deployment successful"
                docker image prune -f
                exit 0
              fi

              echo "Waiting... (${i}/10)"
              sleep 3
            done

            echo "Health check failed"
            docker logs --tail 100 "${CONTAINER}" || true
            exit 1
