name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare artifact
        id: artifact
        run: |
          DEPLOY_HASH=$(find . -type f \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path './__pycache__/*' \
            -not -path './results/*' \
            -not -path './.env' \
            | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=${DEPLOY_HASH}" >> "$GITHUB_OUTPUT"

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "s3_key=deployments/${OWNER}/${REPO}/${DEPLOY_HASH}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to S3
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='results' \
            --exclude='.env' \
            .
          aws s3 cp /tmp/deploy.tar.gz \
            "s3://${{ secrets.S3_BUCKET }}/${{ steps.artifact.outputs.s3_key }}/deploy.tar.gz"

      - name: Upload deploy script to S3
        run: |
          aws s3 cp scripts/deploy.sh \
            "s3://${{ secrets.S3_BUCKET }}/scripts/deploy.sh"

      - name: Deploy to EC2 via SSM
        id: deploy
        run: |
          OWNER="${{ steps.artifact.outputs.owner }}"
          REPO="${{ steps.artifact.outputs.repo }}"
          HASH="${{ steps.artifact.outputs.hash }}"
          S3_KEY="${{ steps.artifact.outputs.s3_key }}"
          S3_BUCKET="${{ secrets.S3_BUCKET }}"

          # Export OAuth secrets as DEPLOY_* env vars for deploy.sh
          DEPLOY_ENV="export DEPLOY_GITHUB_CLIENT_ID='${{ secrets.OAUTH_CLIENT_ID }}'"
          DEPLOY_ENV="${DEPLOY_ENV} && export DEPLOY_GITHUB_CLIENT_SECRET='${{ secrets.OAUTH_CLIENT_SECRET }}'"
          DEPLOY_ENV="${DEPLOY_ENV} && export DEPLOY_JWT_SECRET='${{ secrets.JWT_SECRET }}'"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"${DEPLOY_ENV} && aws s3 cp s3://${S3_BUCKET}/scripts/deploy.sh /tmp/deploy.sh && chmod +x /tmp/deploy.sh && /tmp/deploy.sh ${OWNER} ${REPO} ${HASH} ${S3_BUCKET} ${S3_KEY}\"]}" \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM command ${COMMAND_ID}..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: ${STATUS}"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            echo "Status: ${STATUS} (attempt ${i}/30)"
            sleep 10
          done

          echo "Timed out waiting for deployment"
          exit 1

      - name: Verify deployment
        if: success()
        run: |
          OWNER="${{ steps.artifact.outputs.owner }}"
          REPO="${{ steps.artifact.outputs.repo }}"
          URL="http://ec2-54-221-222-244.compute-1.amazonaws.com/${OWNER}/${REPO}/health"

          echo "Checking ${URL}..."
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt ${i}/5 - HTTP ${HTTP_CODE}"
            sleep 5
          done

          echo "WARNING: Health check did not return 200, but deployment may still be starting"
