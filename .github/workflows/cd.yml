name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Ubuntu

    # CI가 성공했을 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy Docker container
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          UBUNTU_SSH_HOST: ${{ secrets.UBUNTU_SSH_HOST }}
          UBUNTU_SSH_PORT: ${{ secrets.UBUNTU_SSH_PORT }}
          UBUNTU_SSH_USER: ${{ secrets.UBUNTU_SSH_USER }}
          UBUNTU_SSH_PASSWORD: ${{ secrets.UBUNTU_SSH_PASSWORD }}
          UBUNTU_RUNNER_PATH: ${{ secrets.UBUNTU_RUNNER_PATH }}
          UBUNTU_WORKING_DIR: ${{ secrets.UBUNTU_WORKING_DIR }}
          UBUNTU_PYTHON_COMMAND: ${{ secrets.UBUNTU_PYTHON_COMMAND }}

          ENGINE_SHARED_TOKEN: ${{ secrets.ENGINE_SHARED_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

          # OAuth callback must use the browser-reachable HTTPS ingress.
          # SERVER_HOST is only the SSH destination and port 8000 is not public.
          PUBLIC_BASE_URL: https://112.186.136.153

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,OAUTH_CLIENT_ID,OAUTH_CLIENT_SECRET,JWT_SECRET,DATABASE_URL,UBUNTU_SSH_HOST,UBUNTU_SSH_PORT,UBUNTU_SSH_USER,UBUNTU_SSH_PASSWORD,UBUNTU_RUNNER_PATH,UBUNTU_WORKING_DIR,UBUNTU_PYTHON_COMMAND,ENGINE_SHARED_TOKEN,ALLOWED_ORIGINS,PUBLIC_BASE_URL

          script: |
            set -e

            IMAGE="${DOCKERHUB_USERNAME}/capstone-back:${IMAGE_TAG}"
            CONTAINER="capstone-back"
            NETWORK="capstone-internal"
            ROUTER="capstone-deploy-router"

            echo "Deploying ${IMAGE}"

            echo "${DOCKERHUB_TOKEN}" | docker login \
              -u "${DOCKERHUB_USERNAME}" \
              --password-stdin

            docker pull "${IMAGE}"

            # The public Caddy ingress forwards to this router. Keeping the
            # backend on the same network makes /auth and /api reachable over
            # the public HTTPS address without exposing port 8000 directly.
            docker network inspect "${NETWORK}" >/dev/null
            docker inspect "${ROUTER}" >/dev/null

            docker rm -f "${CONTAINER}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER}" \
              --restart unless-stopped \
              --network "${NETWORK}" \
              --network-alias backend \
              -p 8000:8000 \
              -e GITHUB_CLIENT_ID="${OAUTH_CLIENT_ID}" \
              -e GITHUB_CLIENT_SECRET="${OAUTH_CLIENT_SECRET}" \
              -e GITHUB_REDIRECT_URI="${PUBLIC_BASE_URL}/auth/github/callback" \
              -e FRONTEND_REDIRECT_URL="${PUBLIC_BASE_URL}/auth/success" \
              -e JWT_SECRET="${JWT_SECRET}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e UBUNTU_SSH_HOST="${UBUNTU_SSH_HOST}" \
              -e UBUNTU_SSH_PORT="${UBUNTU_SSH_PORT}" \
              -e UBUNTU_SSH_USER="${UBUNTU_SSH_USER}" \
              -e UBUNTU_SSH_PASSWORD="${UBUNTU_SSH_PASSWORD}" \
              -e UBUNTU_RUNNER_PATH="${UBUNTU_RUNNER_PATH}" \
              -e UBUNTU_WORKING_DIR="${UBUNTU_WORKING_DIR}" \
              -e UBUNTU_PYTHON_COMMAND="${UBUNTU_PYTHON_COMMAND}" \
              -e ENGINE_SHARED_TOKEN="${ENGINE_SHARED_TOKEN}" \
              -e ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
              "${IMAGE}"

            echo "Waiting for application..."

            for i in $(seq 1 10); do
              if docker exec "${CONTAINER}" \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" \
                >/dev/null 2>&1; then

                ROUTES_DIR="$(docker inspect "${ROUTER}" --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/routes"}}{{.Source}}{{end}}{{end}}')"
                if [ -z "${ROUTES_DIR}" ] || [ ! -d "${ROUTES_DIR}" ]; then
                  echo "Router host routes directory not found"
                  exit 1
                fi

                # /etc/nginx/routes is intentionally read-only inside the
                # router. Write to its bind-mount source on the host instead.
                cat <<'NGINX_ROUTE' > "${ROUTES_DIR}/capstone-back.conf"
            location = /health {
              set $capstone_backend capstone-back:8000;
              proxy_pass http://$capstone_backend;
            }
            location = /docs {
              set $capstone_backend capstone-back:8000;
              proxy_pass http://$capstone_backend;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
            }
            location = /openapi.json {
              set $capstone_backend capstone-back:8000;
              proxy_pass http://$capstone_backend;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
            }
            location = /redoc {
              set $capstone_backend capstone-back:8000;
              proxy_pass http://$capstone_backend;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
            }
            location ^~ /auth/ {
              set $capstone_backend capstone-back:8000;
              proxy_pass http://$capstone_backend;
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $cicd_real_ip;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Host $cicd_forwarded_host;
              proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
              proxy_set_header X-Forwarded-Port $cicd_forwarded_port;
            }
            location ^~ /api/ {
              set $capstone_backend capstone-back:8000;
              proxy_pass http://$capstone_backend;
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $cicd_real_ip;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Host $cicd_forwarded_host;
              proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
              proxy_set_header X-Forwarded-Port $cicd_forwarded_port;
            }
            NGINX_ROUTE

                docker exec "${ROUTER}" nginx -t
                docker exec "${ROUTER}" nginx -s reload

                curl --fail --silent --show-error "${PUBLIC_BASE_URL}/health" >/dev/null
                echo "Deployment successful: OAuth callback=${PUBLIC_BASE_URL}/auth/github/callback"
                docker image prune -f
                exit 0
              fi

              echo "Waiting... (${i}/10)"
              sleep 3
            done

            echo "Health check failed"
            docker logs --tail 100 "${CONTAINER}" || true
            exit 1
